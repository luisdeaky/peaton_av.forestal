<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GeoPeatón Forestal</title>
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        /* Solución para mapa cortado: usamos vh (view height) */
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; /* Evita que la pantalla se mueva */
        }
        #map { 
            height: 100vh; /* Fuerza al mapa a ocupar toda la altura del dispositivo */
            width: 100vw; 
            background: #e5e3df; 
        }
        #status-bar { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            right: 10px;
            z-index: 1000; 
            background: white; 
            padding: 12px;
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center; 
            font-size: 14px;
            font-weight: bold;
            border: 2px solid #007bff;
        }
    </style>
</head>
<body>

<div id="status-bar">🛰️ Iniciando mapa...</div>
<div id="map"></div>

<script src="https://unpkg.com"></script>
<script>
    // Centro inicial: Av. Forestal y Snopek
    const forestalCenter = [-24.238, -65.257];
    const map = L.map('map', {
        center: forestalCenter,
        zoom: 16,
        zoomControl: false // Limpiamos la pantalla de botones
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // Marcador del usuario
    const userMarker = L.circleMarker(forestalCenter, {
        radius: 10, color: 'white', fillColor: '#007bff', fillOpacity: 1, weight: 3
    }).addTo(map);

    // Puntos de Interés
    const pois = [
        { name: "Hospital Snopek", coords: [-24.2405, -65.2588] },
        { name: "Delegación Municipal", coords: [-24.2372, -65.2535] },
        { name: "Registro Civil", coords: [-24.2390, -65.2560] }
    ];
    pois.forEach(p => L.marker(p.coords).addTo(map).bindPopup(p.name));

    // Cruce Peligroso
    const crossings = [
        { name: "¡CUIDADO! Cruce Av. Snopek", coords: [-24.2401, -65.2592] }
    ];

    function onLocationFound(e) {
        userMarker.setLatLng(e.latlng);
        map.setView(e.latlng); // El mapa se centra en vos
        document.getElementById('status-bar').innerText = "✅ Ubicación en tiempo real activa";
        document.getElementById('status-bar').style.borderColor = "#28a745";

        crossings.forEach(c => {
            if (e.latlng.distanceTo(L.latLng(c.coords)) < 40) {
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                document.getElementById('status-bar').innerText = "⚠️ " + c.name;
                document.getElementById('status-bar').style.background = "#ffeb3b";
            }
        });
    }

    function onLocationError(e) {
        document.getElementById('status-bar').innerText = "⚠️ Error: Activa GPS y da permiso";
        document.getElementById('status-bar').style.borderColor = "red";
    }

    map.on('locationfound', onLocationFound);
    map.on('locationerror', onLocationError);

    // Configuramos para que no falle si la señal es débil
    map.locate({ setView: true, watch: true, enableHighAccuracy: false });

    // REPARACIÓN FINAL: Forzamos el redibujado del mapa tras cargar
    window.addEventListener('load', () => {
        setTimeout(() => { map.invalidateSize(); }, 500);
    });
</script>
</body>
</html>
